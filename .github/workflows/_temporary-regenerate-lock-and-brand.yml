name: Temporary secure lockfile and FODIP brand asset

on:
  push:
    branches:
      - fix/security-multer-local-fodip-logo

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Regenerate lockfile with patched Multer override
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Fetch exact official FODIP logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/brand
          tmp="$(mktemp)"
          selected=''
          for source in \
            'https://hom-app.fodip.gov.gn/assets/img/fodip.jpg' \
            'https://fodip.gov.gn/images/logo/1719846542.jpg'; do
            echo "Trying official FODIP asset: ${source}"
            if ! curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent 'Mozilla/5.0 FODIP-Digital-2030/1.0' \
              --output "${tmp}" "${source}"; then
              continue
            fi
            if SOURCE="${source}" FILE="${tmp}" python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['FILE'])
          data = path.read_bytes()
          if len(data) < 1000:
              raise SystemExit(1)
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit(1)
          print(f"Validated official FODIP JPEG from {os.environ['SOURCE']}: {len(data)} bytes")
          PY
            then
              selected="${source}"
              break
            fi
          done
          if [ -z "${selected}" ]; then
            echo 'No official FODIP government host returned a valid JPEG asset.' >&2
            exit 1
          fi
          mv "${tmp}" apps/web/public/brand/fodip-official.jpg
          printf '%s\n' "${selected}" > /tmp/fodip-logo-source.txt

      - name: Verify vulnerable Multer resolution is gone
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  multer: 2.3.0$' pnpm-lock.yaml
          if grep -q '^  multer@2.2.0:' pnpm-lock.yaml; then
            echo 'multer 2.2.0 still exists in the regenerated lockfile' >&2
            exit 1
          fi

      - name: Commit generated lockfile and exact brand asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml apps/web/public/brand/fodip-official.jpg
          git rm .github/workflows/_temporary-regenerate-lock-and-brand.yml
          git commit -m 'chore: regenerate secure lockfile and vendor official FODIP logo'
          git push origin HEAD:${GITHUB_REF_NAME}
