name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Pre-push rules, API tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-push invariant tests
        run: pnpm test:prepush

      - name: Static analysis
        run: pnpm lint

      - name: API e2e tests
        run: pnpm --filter @fodip/api test

      - name: Build API
        run: pnpm --filter @fodip/api build

      - name: Build web
        run: pnpm --filter @fodip/web build
