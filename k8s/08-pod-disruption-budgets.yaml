apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fodip-api
  namespace: fodip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fodip-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fodip-web
  namespace: fodip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fodip-web
