name: Publication OCI institutionnelle

on:
  push:
    tags:
      - "v*.*.*"

# Publication is deliberately isolated from CI: only a SemVer tag on an already validated main
# commit can write packages. No long-lived registry or signing credential is stored in GitHub.
permissions:
  contents: read
  checks: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publier, attester et signer les images OCI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          checks="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          jq -e '[.check_runs[] | select(.name == "Dossier de preuves institutionnel" and .conclusion == "success")] | length > 0' <<<"$checks"
          jq -e '[.check_runs[] | select(.name == "Analyze (javascript-typescript)" and .conclusion == "success")] | length > 0' <<<"$checks"

      - name: Resolve immutable image names
        id: names
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "prefix=$prefix"
            echo "api_tags<<EOF"
            echo "$prefix-api:$GITHUB_REF_NAME"
            echo "$prefix-api:sha-$short_sha"
            echo "EOF"
            echo "web_tags<<EOF"
            echo "$prefix-web:$GITHUB_REF_NAME"
            echo "$prefix-web:sha-$short_sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish API image with SBOM
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.api_tags }}
          sbom: true
          provenance: false

      - name: Build and publish web image with SBOM
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.web_tags }}
          sbom: true
          provenance: false

      - name: Attest API build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.names.outputs.prefix }}-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest web build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.names.outputs.prefix }}-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable image digests
        env:
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-oci.yml@$GITHUB_REF"
          cosign sign --yes "$IMAGE_PREFIX-api@$API_DIGEST"
          cosign sign --yes "$IMAGE_PREFIX-web@$WEB_DIGEST"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_PREFIX-api@$API_DIGEST"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_PREFIX-web@$WEB_DIGEST"

      - name: Generate release manifest
        env:
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          jq -n \
            --arg release "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg api "$IMAGE_PREFIX-api@$API_DIGEST" \
            --arg web "$IMAGE_PREFIX-web@$WEB_DIGEST" \
            '{schemaVersion: 1, release: $release, commit: $commit, images: {api: $api, web: $web}}' \
            > release-manifest.json
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release-manifest.json

      - name: Upload signed release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ github.ref_name }}
          path: |
            release-manifest.json
            release-manifest.sigstore.json
          retention-days: 365
