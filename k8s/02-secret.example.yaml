# TEMPLATE - every value below is a placeholder (the same CHANGE_ME convention as .env.example
# at the repo root), never a real credential. Copy this file to 02-secret.yaml, fill in real
# values, and do NOT commit that copy - .gitignore already covers `*.secret.yaml` for this
# reason (see the entry added alongside this file). Prefer your cluster's real secret management
# (sealed-secrets, external-secrets synced from a vault, SOPS, ...) over a plain `kubectl apply`
# of a file sitting on disk wherever that's available - this manifest is the minimum that works
# everywhere, not the recommended end state.
apiVersion: v1
kind: Secret
metadata:
  name: fodip-secrets
  namespace: fodip
type: Opaque
stringData:
  DATABASE_URL: postgresql://CHANGE_ME:CHANGE_ME@CHANGE_ME:5432/fodip
  # At least 32 characters in production - security-policy.js#resolveJwtSecret refuses to start
  # otherwise. Generate one with e.g. `openssl rand -base64 48`.
  JWT_SECRET: CHANGE_ME
  # Optional - axe E4 (rotation des clés, docs/14-ROADMAP-SAAS-PREMIUM.md). Only set while
  # actively rotating JWT_SECRET; see .env.example for the full explanation.
  JWT_SECRET_PREVIOUS: ""
  # S3-compatible object storage - a self-hosted MinIO (see the local demo stack's own `minio`
  # service in docker-compose.yml for a reference deployment) or any other S3-compatible provider
  # not tied to a specific cloud vendor.
  STORAGE_ENDPOINT: https://CHANGE_ME
  STORAGE_ACCESS_KEY: CHANGE_ME
  STORAGE_SECRET_KEY: CHANGE_ME
  # Institutional SSO (OpenID Connect) - optional, axe B4. Leave all four empty to keep the
  # platform on email/password + TOTP only, exactly like the local demo stack.
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URI: ""
