name: CI

# Sprint Enterprise 0, Lot 1: split into parallel jobs instead of one 25-minute sequential job -
# lint/tests/build/security fail fast and independently, and the expensive Docker+Playwright job
# (`docker`) only starts once those are green, so a broken build doesn't burn 10+ minutes of
# Docker Compose time before failing anyway. GitHub Actions pinned by immutable commit SHA
# throughout (the `# vX.Y.Z` comment is what a human reads; the SHA is what actually runs).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  invariants:
    name: Qualité, lint et invariants pré-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/test-prepush.sh: policy module syntax + their node:test suites, migration/Docker
      # topology/license invariant checks, shell syntax checks on the ops scripts, and lint for
      # both workspaces - the exact command a contributor runs locally before pushing.
      - name: Pre-push invariants (lint, policy tests, migration/Docker/license checks)
        run: pnpm test:prepush

  unit-tests:
    name: Tests unitaires API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No PostgreSQL/MinIO service container here on purpose: every current apps/api/test/*
      # spec (*.spec.ts, *.e2e-spec.ts) is either a mocked-repository unit test or an e2e-spec.ts
      # that only exercises public/protected-by-default routes (never reaches the database) -
      # verified by reading every spec file, not assumed. Real-Postgres coverage of the
      # repository layer itself (row locking, unique-constraint conflicts, genuine concurrency)
      # is the separate `integration-tests` job below (Sprint Enterprise 0 Lot 2, axe E2 -
      # docs/14-ROADMAP-SAAS-PREMIUM.md) - *.integration-spec.ts files, excluded from this job's
      # testRegex on purpose (jest.config.js vs. jest.integration.config.js).
      - name: API tests with coverage
        run: pnpm --filter @fodip/api test -- --coverage --coverageReporters=text-summary --coverageReporters=json-summary --coverageReporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 30

  integration-tests:
    name: Tests d'intégration API (PostgreSQL réel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `services:` block needed: apps/api/test/integration/support/database.ts starts its own
      # disposable postgres:16.10-alpine container per spec file via Testcontainers (the same
      # library, the same image docker-compose.yml's `postgres` service pins) - ubuntu-latest
      # runners already have a working Docker daemon. Verified locally against a real Postgres
      # before this was wired into CI (see docs/19-GOUVERNANCE-SUPPLY-CHAIN.md, axe E2): this
      # sandbox's own egress policy blocks Docker Hub image pulls, so a native `postgres` install
      # stood in for Testcontainers there via TEST_DATABASE_URL - deliberately not set here, so
      # this job exercises the real, hermetic, disposable-container path.
      - name: Financings integration tests (real PostgreSQL, row locking, concurrency)
        run: pnpm --filter @fodip/api test:integration

  build:
    name: Builds (API + Web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @fodip/api build

      - name: Build web
        run: pnpm --filter @fodip/web build

  security:
    name: Sécurité (audit, licences, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just this commit

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any severity by default; --prod scopes to what actually ships (a devDependency
      # like @nestjs/cli's own build-tool chain never reaches the runtime image). Dev-only
      # findings are tracked by Dependabot instead of blocking every PR on a build-tool-only
      # ReDoS that never sees attacker input in this repo's usage.
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

      - name: License policy check
        run: python3 scripts/check-licenses.py

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            git /repo -c /repo/.gitleaks.toml --redact

      # Requires the repository's own "Dependency graph" setting (Settings > Security > Code
      # security and analysis) - a repo setting this workflow cannot enable on its own, and this
      # session's tools have no API access to toggle either (confirmed: no branch-protection or
      # security-analysis settings tool available). continue-on-error so a PR is never blocked
      # by infrastructure this workflow doesn't control - real findings from pnpm audit and
      # check-licenses.py above still block normally. DÉCISION REQUISE : le propriétaire du dépôt
      # doit activer "Dependency graph" pour que cette étape ait un effet réel plutôt que
      # d'échouer silencieusement (avertissement visible dans le résumé du job sinon).
      - name: Dependency review (new/changed dependencies only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # Matches scripts/check-licenses.py's policy (see that file for the reasoning): strong
          # copyleft and non-commercial/share-alike licenses are incompatible with an UNLICENSED/
          # propriétaire codebase (LICENSE), weak copyleft (LGPL, MPL) is fine to consume.
          deny-licenses: GPL-1.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, AGPL-1.0-or-later, AGPL-3.0-or-later

  docker:
    name: Docker Compose, Playwright et audit des images
    needs: [invariants, unit-tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      # Fails the job on a CRITICAL/HIGH finding in either image (OS packages + language deps
      # baked into the final layer, which pnpm audit cannot see - a stale base-image package is
      # exactly the class of finding pnpm audit structurally cannot catch) - --scanners
      # vuln,secret so a credential accidentally baked into a layer is caught the same way.
      # ghcr.io, not Docker Hub: Aquasecurity only publishes the aquasecurity/trivy image to
      # GHCR (docker.io/aquasecurity/trivy doesn't exist - confirmed the hard way, a first
      # version of this step failed CI with a real "pull access denied" until this was fixed).
      - name: Scan API image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/root/.trivyignore:ro" \
            ghcr.io/aquasecurity/trivy:0.74.0 image \
            --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile /root/.trivyignore \
            fodip-digital-api:latest
        if: always()

      - name: Scan web image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/root/.trivyignore:ro" \
            ghcr.io/aquasecurity/trivy:0.74.0 image \
            --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile /root/.trivyignore \
            fodip-digital-web:latest
        if: always()

      - name: Generate SBOM (API image)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: fodip-digital-api:latest
          format: cyclonedx-json
          output-file: sbom-api.cyclonedx.json

      - name: Generate SBOM (web image)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: fodip-digital-web:latest
          format: cyclonedx-json
          output-file: sbom-web.cyclonedx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sbom-*.cyclonedx.json
          retention-days: 90

      - name: Start Docker platform
        run: docker compose up --detach

      - name: Docker smoke test
        run: bash scripts/docker-smoke.sh

      - name: Backup and restore smoke test (axe C6)
        run: bash scripts/test-backup-restore.sh

      - name: Install Playwright browsers
        run: pnpm --filter @fodip/web exec playwright install --with-deps chromium

      - name: Web e2e tests
        run: pnpm --filter @fodip/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker platform
        if: always()
        run: docker compose down --volumes
