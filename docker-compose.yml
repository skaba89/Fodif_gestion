name: fodip-digital

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fodip}
      POSTGRES_USER: ${POSTGRES_USER:-fodip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fodip_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    image: postgres:16.10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-fodip}
      PGUSER: ${POSTGRES_USER:-fodip}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fodip_local_dev}
    volumes:
      - ./database:/migrations:ro
    command: >-
      sh -ec 'for file in /migrations/[0-9][0-9][0-9]_*.sql;
      do echo "Applying $$file"; psql --set ON_ERROR_STOP=1 --file "$$file"; done'
    restart: "no"

  seed:
    image: postgres:16.10-alpine
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-fodip}
      PGUSER: ${POSTGRES_USER:-fodip}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fodip_local_dev}
    volumes:
      - ./database/seeds:/seeds:ro
    command: >-
      sh -ec 'for file in /seeds/[0-9][0-9][0-9]_*.sql;
      do echo "Applying $$file"; psql --set ON_ERROR_STOP=1 --file "$$file"; done'
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fodip_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fodip_local_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fodip}:${POSTGRES_PASSWORD:-fodip_local_dev}@postgres:5432/${POSTGRES_DB:-fodip}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-fodip-local-docker-jwt-secret-change-before-hosting}
      JWT_ISSUER: fodip-digital-2030
      JWT_AUDIENCE: fodip-web
      JWT_ACCESS_TTL: 15m
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: fodip-documents
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-fodip_local}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fodip_local_secret}
      # Institutional SSO (OpenID Connect, e.g. Keycloak) - optional, axis B4. Unset by default
      # (empty values keep OidcService.isEnabled() false) so the local demo stays on
      # email/password + TOTP only. Set all four on the host to try SSO against a local IdP.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      # Browser-reachable API URL, distinct from the Docker-internal API_BASE_URL above: needed
      # so the OIDC "sign in with SSO" link can redirect the browser straight to the API (which
      # the browser cannot reach via the `api` service name). Only used when OIDC is enabled.
      API_PUBLIC_URL: http://localhost:${API_PORT:-4000}
      COOKIE_SECURE: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Axe C4 (docs/14-ROADMAP-SAAS-PREMIUM.md) - an operations dashboard reading the metrics axe C3b
  # already exposes (apps/api/src/metrics/, GET /api/v1/metrics). Both behind the "observability"
  # profile: excluded from a plain `docker compose up` (so CI, which never passes --profile, is
  # completely unaffected - no extra images to pull, no extra containers to wait on) and started
  # on request with `docker compose --profile observability up`.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fodip_local_admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
