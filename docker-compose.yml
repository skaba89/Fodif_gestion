name: fodip-digital

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fodip}
      POSTGRES_USER: ${POSTGRES_USER:-fodip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fodip_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sprint Enterprise 0 - fondations entreprise, axe P0 4.4 : réutilise l'image `api` déjà
  # construite (apps/api/Dockerfile embarque scripts/run-migrations.js et database/ dans son stage
  # runtime) plutôt qu'un simple rejeu psql de tous les fichiers à chaque fois - le nouveau runner
  # ne (re)joue que les migrations non encore appliquées, détecte un fichier déjà appliqué puis
  # modifié (écart de somme de contrôle) et refuse plutôt que de le rejouer, et empêche deux
  # exécutions concurrentes via un verrou consultatif PostgreSQL - voir
  # apps/api/scripts/run-migrations.js pour le mécanisme complet et son propre test
  # d'intégration. Même image que le service `api`, même contexte de build : Compose la construit
  # une seule fois et la réutilise pour les deux services.
  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fodip}:${POSTGRES_PASSWORD:-fodip_local_dev}@postgres:5432/${POSTGRES_DB:-fodip}
      DATABASE_SSL: "false"
    command: ["node", "scripts/run-migrations.js"]
    restart: "no"

  seed:
    image: postgres:16.10-alpine
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-fodip}
      PGUSER: ${POSTGRES_USER:-fodip}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fodip_local_dev}
    volumes:
      - ./database/seeds:/seeds:ro
    command: >-
      sh -ec 'for file in /seeds/[0-9][0-9][0-9]_*.sql;
      do echo "Applying $$file"; psql --set ON_ERROR_STOP=1 --file "$$file"; done'
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fodip_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fodip_local_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fodip}:${POSTGRES_PASSWORD:-fodip_local_dev}@postgres:5432/${POSTGRES_DB:-fodip}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-fodip-local-docker-jwt-secret-change-before-hosting}
      # Optional, axis E4 (key rotation) - set to JWT_SECRET's previous value while rotating so
      # tokens already handed out keep verifying; unset once the rotation window is over. See
      # .env.example.
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      JWT_ISSUER: fodip-digital-2030
      JWT_AUDIENCE: fodip-web
      JWT_ACCESS_TTL: 15m
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: fodip-documents
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-fodip_local}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fodip_local_secret}
      # Institutional SSO (OpenID Connect, e.g. Keycloak) - optional, axis B4. Unset by default
      # (empty values keep OidcService.isEnabled() false) so the local demo stays on
      # email/password + TOTP only. Set all four on the host to try SSO against a local IdP.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # Antivirus document scanning (axe E6, docs/14-ROADMAP-SAAS-PREMIUM.md) - optional, like OIDC
      # above. Unset by default (empty CLAMAV_HOST keeps ClamAvService.isEnabled() false), so the
      # plain local demo and CI's document integration tests never require a running ClamAV daemon.
      # Set CLAMAV_HOST=clamav (with the `antivirus` profile enabled below) to scan real uploads.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    ports:
      - "${API_PORT:-4000}:4000"
    # Axe E7 (docs/14-ROADMAP-SAAS-PREMIUM.md) - no `healthcheck:` override here on purpose: the
    # image itself now carries this exact check (apps/api/Dockerfile's own HEALTHCHECK), which
    # Compose applies automatically when a service doesn't redefine one. `depends_on: condition:
    # service_healthy` below still works against it the same way an override would.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      # Browser-reachable API URL, distinct from the Docker-internal API_BASE_URL above: needed
      # so the OIDC "sign in with SSO" link can redirect the browser straight to the API (which
      # the browser cannot reach via the `api` service name). Only used when OIDC is enabled.
      API_PUBLIC_URL: http://localhost:${API_PORT:-4000}
      COOKIE_SECURE: "false"
      # Mission "présentation Directeur général", axe 9 (mode présentation) - a runtime env var,
      # not a NEXT_PUBLIC_ build-time one: this same `web` image serves both the plain local demo
      # and the presentation profile unmodified, read via GET /api/config
      # (apps/web/app/api/config/route.ts) rather than baked into the client bundle at build time.
      # Defaults to false - a plain `docker compose up` never shows the demo banner; only
      # docker-compose.presentation.yml's override (scripts/demo-presentation.sh) sets it.
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Axe C4 (docs/14-ROADMAP-SAAS-PREMIUM.md) - an operations dashboard reading the metrics axe C3b
  # already exposes (apps/api/src/metrics/, GET /api/v1/metrics). Both behind the "observability"
  # profile: excluded from a plain `docker compose up` (so CI, which never passes --profile, is
  # completely unaffected - no extra images to pull, no extra containers to wait on) and started
  # on request with `docker compose --profile observability up`.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fodip_local_admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  # Axe E6 (docs/14-ROADMAP-SAAS-PREMIUM.md) - antivirus scanning for document uploads
  # (apps/api/src/documents/clamav.service.ts). Behind the "antivirus" profile, same reasoning as
  # "observability" above: excluded from a plain `docker compose up` and from CI (which never
  # passes --profile, and whose document integration tests run their own hand-built fake clamd
  # instead - see apps/api/test/integration/documents.integration-spec.ts), started on request with
  # `docker compose --profile antivirus up`. Not wired as a `depends_on` of `api`: Compose starts a
  # dependency's profile automatically, which would defeat the point of gating this service - set
  # CLAMAV_HOST=clamav on the `api` service (see above) once this profile is enabled.
  #
  # Not verified with a real `docker compose up` in this sandbox (outbound Docker Hub pulls are
  # blocked here - the same limitation already documented for docker-compose.presentation.yml);
  # verified with `docker compose --profile antivirus config` only. Real verification is CI's.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["antivirus"]
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  clamav_data:
