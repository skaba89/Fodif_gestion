# Render Blueprint for the Neon-backed qualification environment documented in
# docs/15-DEPLOIEMENT-TEST.md. Secrets (sync: false) must be filled in by hand after import;
# nothing sensitive belongs in this file.

services:
  - type: web
    name: fodip-api
    runtime: docker
    plan: free
    region: ohio # same geography as Neon's us-east-2, required for Neon Object Storage beta
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Render pre-deploy commands are paid-only. On the free plan, run the locked/checksummed
    # migrations and optional one-time admin bootstrap before starting the API process.
    dockerCommand: /bin/bash -c "node scripts/run-migrations.js && node scripts/bootstrap-super-admin.js && exec node dist/main.js"
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled connection string (-pooler hostname)
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon direct connection string, migrations/bootstrap only
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: fodip-digital-2030
      - key: JWT_AUDIENCE
        value: fodip-web
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false # remove all BOOTSTRAP_* values immediately after first successful deploy
      - key: BOOTSTRAP_ADMIN_NOM
        sync: false
      - key: BOOTSTRAP_ADMIN_PRENOM
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false # S3-compatible endpoint - see docs/15 étape 2
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: WEB_BASE_URL
        sync: false # the web service's public URL - fill in after step 5, see docs/15 étape 6

  - type: web
    name: fodip-web
    runtime: docker
    plan: free
    region: ohio
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: API_BASE_URL
        sync: false # the api service's public URL - see docs/15 étape 3
