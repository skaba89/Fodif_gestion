name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Pre-push rules, API tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-push invariant tests
        run: pnpm test:prepush

      - name: Static analysis
        run: pnpm lint

      - name: API e2e tests
        run: pnpm --filter @fodip/api test

      - name: Build API
        run: pnpm --filter @fodip/api build

      - name: Build web
        run: pnpm --filter @fodip/web build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start Docker platform
        run: docker compose up --detach --build

      - name: Docker smoke test
        run: bash scripts/docker-smoke.sh

      - name: Backup and restore smoke test (axe C6)
        run: bash scripts/test-backup-restore.sh

      - name: Install Playwright browsers
        run: pnpm --filter @fodip/web exec playwright install --with-deps chromium

      - name: Web e2e tests
        run: pnpm --filter @fodip/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker platform
        if: always()
        run: docker compose down --volumes
